<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whoismatheo</title>
<meta name="description" content="whoismatheo — somewhere on the internet.">
<meta name="theme-color" content="#080808">
<meta property="og:title" content="whoismatheo">
<script>try{var h=document.documentElement;h.dataset.theme=localStorage.getItem("theme")||"dark";h.classList.add("js");if(localStorage.getItem("seen"))h.classList.add("quick")}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<header class="nav intro-i" style="--d:.1s">
  <nav aria-label="Main"><a href="#home" data-i18n="home"></a><a href="#about" data-i18n="about"></a><a href="#history" data-i18n="music"></a></nav>
  <div class="ctrl">
    <button id="theme" class="btn" data-i18n-label="theme" title="Theme"><svg class="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ic moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg></button>
    <button id="mute" class="btn" type="button" disabled data-muted="false"><svg class="ic i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.500 9a4 4 0 010 6M19 6.500a8 8 0 010 11"/></svg><svg class="ic i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9.500l4 5M21 9.500l-4 5"/></svg></button>
    <div class="lang" id="langwrap"><button id="lang" class="btn lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-menu" data-i18n-label="language"><span id="lang-cur" class="mono">EN</span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button><ul id="lang-menu" class="lang-menu" role="listbox" tabindex="-1" data-i18n-label="language"><li role="option" id="lo-en" data-lang="en" style="--i:0"><i></i><span class="mono">EN</span><span>English</span></li><li role="option" id="lo-es" data-lang="es" style="--i:1"><i></i><span class="mono">ES</span><span>Español</span></li><li role="option" id="lo-ru" data-lang="ru" style="--i:2"><i></i><span class="mono">RU</span><span>Русский</span></li><li role="option" id="lo-de" data-lang="de" style="--i:3"><i></i><span class="mono">DE</span><span>Deutsch</span></li><li role="option" id="lo-fr" data-lang="fr" style="--i:4"><i></i><span class="mono">FR</span><span>Français</span></li></ul></div>
  </div>
</header>
<main>
<section id="home" class="hero">
  <svg class="orbit intro-i" style="--d:.35s" viewBox="-200 -100 400 200" aria-hidden="true"><g transform="rotate(-12)"><ellipse class="ring" pathLength="1" rx="170" ry="52"/><ellipse class="ring r2" rx="118" ry="34"/><circle r="3.5"><animateMotion dur="75s" repeatCount="indefinite" path="M170 0A170 52 0 1 1 -170 0A170 52 0 1 1 170 0"/></circle><circle r="2.5" opacity=".6"><animateMotion dur="110s" repeatCount="indefinite" path="M-118 0A118 34 0 1 0 118 0A118 34 0 1 0 -118 0"/></circle></g><path class="twinkle" d="M0-26Q3-3 26 0Q3 3 0 26Q-3 3-26 0Q-3-3 0-26Z"/></svg>
  <p class="tag mono intro-i" style="--d:1s" data-i18n="hero"></p>
</section>

<section id="discord" class="card rv" aria-live="polite">
  <div class="row mono small"><span><i class="dot on"></i> <span data-i18n="presence"></span></span><span><span id="conn-text"></span> <i id="conn-dot" class="dot"></i></span></div>
  <div id="banner" class="banner" data-has="0" aria-hidden="true"><img id="banner-img" alt="" hidden decoding="async"></div>
  <div class="split">
    <div class="pf-main">
      <div class="who pf-who">
        <div class="avatar"><img id="av" alt="" hidden><span id="av-fb">✦</span><img id="av-deco" class="deco" alt="" hidden><i id="st-dot" class="dot st"></i></div>
        <div class="pf-names"><h2 id="name">—</h2><p class="muted mono small" id="uname" hidden></p></div>
      </div>
      <p id="bio" class="bio" data-i18n-label="about" hidden></p>
      <ul id="badges" class="badges" hidden></ul>
      <p class="muted mono small" id="status"></p>
      <p class="mono small" id="custom" hidden></p>
      <p class="muted mono small" id="activity"></p>
      <p class="muted mono small act-sp" id="act-sp" role="img" data-i18n-label="listening" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></p>
    </div>
    <div id="spotify" class="sp idle">
      <div class="sp-head"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><p class="muted mono small" id="sp-label"></p></div>
      <div class="who"><div class="art"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg><img id="sp-art" alt="" width="64" height="64"></div><div class="sp-info"><a id="sp-song" target="_blank" rel="noopener" data-i18n-title="openSpotify"></a><p class="muted mono small" id="sp-artist"></p><p class="muted mono small" id="sp-album"></p></div></div>
      <div class="sp-prog" aria-hidden="true" hidden><span id="sp-cur" class="mono small">0:00</span><i><b id="sp-bar"></b></i><span id="sp-dur" class="mono small">0:00</span></div>
    </div>
  </div>
</section>

<section id="about" class="card rv">
  <div class="row mono small"><span><i class="dot on"></i> <span data-i18n="about"></span></span></div>
  <div class="split">
    <!-- EDIT: About Me texts live in the T dictionary in script.js (aboutTitle, aboutP1, aboutP2, aboutClose) -->
    <div id="about-text" class="mono"><h3 data-i18n="aboutTitle"></h3><p data-i18n="aboutP1"></p><p data-i18n="aboutP2"></p><p class="about-close small" data-i18n="aboutClose"></p></div>
    <div class="geo-wrap"><svg class="geo" viewBox="-100 -100 200 200" aria-hidden="true"><g class="o3"><circle class="g1" r="90"/></g><circle class="g2" r="62"/><circle class="g2" r="36"/><g fill="currentColor"><circle cx="62" r="2.6"><animateMotion dur="50s" repeatCount="indefinite" path="M62 0A62 62 0 1 1 -62 0A62 62 0 1 1 62 0"/></circle><circle cx="36" r="2.6"><animateMotion dur="32s" repeatCount="indefinite" path="M36 0A36 36 0 1 0 -36 0A36 36 0 1 0 36 0"/></circle><circle cx="90" r="2.6"><animateMotion dur="90s" repeatCount="indefinite" path="M90 0A90 90 0 1 1 -90 0A90 90 0 1 1 90 0"/></circle></g><path class="twinkle" d="M0-12Q1-1 12 0Q1 1 0 12Q-1 1-12 0Q-1-1 0-12Z" fill="currentColor"/></svg></div>
  </div>
</section>

<section id="history" class="rv hist-sec" hidden>
  <div class="row hist-head mono small"><span><i class="dot on"></i> <span data-i18n="history"></span></span><span class="car-ctl"><button id="car-prev" class="btn car-btn" type="button" data-i18n-label="prev" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><button id="car-next" class="btn car-btn" type="button" data-i18n-label="next" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></span></div>
  <ul id="hist" class="hist" tabindex="0" data-i18n-label="history"></ul>
  <div id="car-dots" class="car-dots" hidden></div>
  <p id="hist-msg" class="muted mono small" role="status" hidden></p>
</section>
</main>

<aside id="player" class="player intro-i" style="--d:1.3s" aria-label="Music">
  <img id="cover" alt="" hidden>
  <div class="meta"><a id="p-title" target="_blank" rel="noopener" data-i18n-title="openSpotify"></a><p class="muted mono small" id="p-artist"></p><p class="mono small" id="p-status"></p></div>
  <button id="play" class="btn round" disabled><svg class="ic i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="ic i-pause" viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg></button>
  <label class="vol"><span class="sr" data-i18n="volume"></span><input id="volume" type="range" min="0" max="1" step=".01" value=".5" data-i18n-label="volume"></label>
  <div class="prog"><span id="t-cur" class="mono small">0:00</span><input id="seek" type="range" min="0" max="1" step=".001" value="0" disabled data-i18n-label="seek"><span id="t-dur" class="mono small">0:00</span></div>
</aside>

<footer>
  <p class="mono small muted" data-i18n="footer"></p>
  <button id="secret" class="heart intro-i" style="--d:1.8s" data-i18n-label="secret"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20.5S4.5 15.900 2.800 11.100C1.600 7.700 4 4.500 7.200 4.500c2 0 3.700 1.100 4.800 2.800 1.100-1.700 2.800-2.800 4.800-2.800 3.200 0 5.600 3.200 4.400 6.600-1.700 4.800-9.200 9.400-9.200 9.400z"/></svg></button>
</footer>

<dialog id="letter" data-i18n-label="secret">
  <button id="close" class="btn" data-i18n-label="close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <!-- Dedication: text on the left, looping muted video (GIF-style) on the right; one column on phones. The file goes in assets/dedication.mp4 -->
  <div class="ded">
    <p id="l-body"></p>
    <figure class="ded-gif"><video id="l-vid" src="assets/dedication.mp4" muted loop playsinline preload="metadata" disablepictureinpicture aria-hidden="true"></video></figure>
  </div>
</dialog>
<script src="script.js"></script>
</body>
</html>
